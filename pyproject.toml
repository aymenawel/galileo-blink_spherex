[project]
name = "galileo-blink"
version = "0.1.0"
description = "Galileo Blink: watch the infrared sky move. A public blink viewer for NASA SPHEREx images."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "astropy-healpix>=1.0",
    "reproject>=0.14",
    "pillow>=10.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["galileo_blink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to NASA's live services (deselected by default; run with -m live)",
]
addopts = "-m 'not live' -q"
